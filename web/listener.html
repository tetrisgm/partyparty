<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>partyparty</title>
<style>
  :root{
    color-scheme:dark;
    --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
    --label:#f5f5f7; --label-secondary:#a1a1a8; --label-tertiary:#6e6e73;
    --accent:#ff3b7f; --success:#34c759;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--sans);
    background:radial-gradient(120% 120% at 50% 0%, #1b141f 0%, #000 62%);
    color:var(--label);display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;text-align:center;overflow:hidden;
    -webkit-font-smoothing:antialiased;font-synthesis:none;letter-spacing:-.01em;
  }
  h1{font-weight:600;font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--label-secondary);font-size:14px;margin:0 0 36px}
  .btn{
    width:200px;height:200px;border-radius:50%;border:none;cursor:pointer;
    background:var(--accent);color:#fff;font-size:17px;font-weight:600;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    transition:transform .15s ease,background .25s ease;
  }
  .btn:active{transform:scale(.96)}
  body.playing .btn{background:var(--success);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%{box-shadow:0 0 0 28px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
  .ico{font-size:50px;line-height:1}
  .pill{margin-top:26px;font-size:14px;color:var(--label);min-height:20px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--label-tertiary);margin-right:6px;vertical-align:middle}
  body.playing .dot{background:var(--success)}
  .eq{display:flex;gap:5px;height:26px;align-items:flex-end;justify-content:center;margin-top:16px;opacity:0;transition:opacity .3s}
  body.playing .eq{opacity:1}
  .eq i{width:5px;background:var(--accent);border-radius:3px;height:6px;animation:bounce 1s infinite ease-in-out}
  .eq i:nth-child(2){animation-delay:.2s} .eq i:nth-child(3){animation-delay:.4s} .eq i:nth-child(4){animation-delay:.1s} .eq i:nth-child(5){animation-delay:.3s}
  @keyframes bounce{0%,100%{height:6px}50%{height:26px}}
  .count{color:var(--label-secondary);font-size:13px;margin-top:8px;min-height:16px}
  .vol{margin-top:30px;width:220px;max-width:70vw;display:flex;align-items:center;gap:10px;color:var(--label-secondary)}
  .vol input{flex:1;accent-color:var(--accent)}
  .foot{position:fixed;bottom:16px;left:0;right:0;color:var(--label-tertiary);font-size:12px;padding:0 20px}
  @media (prefers-reduced-motion:reduce){body.playing .btn,.eq i{animation:none}}
</style>
</head>
<body>
  <h1 id="title">partyparty</h1>
  <p class="sub">live from the decks</p>

  <button class="btn" id="btn" aria-label="Play">
    <span class="ico" id="ico">►</span>
    <span id="btnlabel">Tap to listen</span>
  </button>

  <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pill"><span class="dot"></span><span id="pilltext">connecting…</span></div>
  <div class="count" id="count"></div>

  <div class="vol">
    <span>🔈</span>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  </div>

  <div class="foot">Keep this browser tab open — audio keeps playing with your screen locked. If it won't start, turn off Silent mode.</div>

  <audio id="player" playsinline preload="none"></audio>
  <script src="/vendor/hls.min.js"></script>
  <script>
    const player = document.getElementById('player');
    const btn = document.getElementById('btn');
    const ico = document.getElementById('ico');
    const btnlabel = document.getElementById('btnlabel');
    const pilltext = document.getElementById('pilltext');
    const titleEl = document.getElementById('title');
    const countEl = document.getElementById('count');
    let STREAM = null, delivery = 'llhls';
    // The room's sync contract: the wall-clock delay behind the DJ that EVERY
    // phone converges to (server-provided). Players park wherever their
    // heuristics like — iOS versions differ by seconds — so alignment to this
    // shared number is what makes the room drop together.
    let latencyTarget = 0;
    let hls = null, started = false, live = false, stalledSinceBeat = false;
    // Player-path choice. Native HLS is the lock-safe path on Apple devices, so
    // Safari/iOS keep it. Everywhere else prefer hls.js: some browsers (Edge,
    // certain Androids) answer 'maybe' to the native-HLS probe but can't
    // actually play it — trusting canPlayType there means silent forever-loading.
    const nativeHLS = !!player.canPlayType('application/vnd.apple.mpegurl');
    const isAppleUA = /iP(hone|ad|od)/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) // iPadOS masquerading as Mac
      || (/Version\/[\d.]+.*Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg\//.test(navigator.userAgent)); // real Safari
    const useNative = nativeHLS && isAppleUA;
    const platform = useNative ? 'native' : 'hls';
    const debug = new URLSearchParams(location.search).get('debug') === '1';

    // Stable per-device id so the DJ console can track each listener across beats.
    // Wrapped: a localStorage throw (locked-down browser) must not abort the script
    // before the play handler wires up.
    let cid;
    try {
      cid = localStorage.getItem('pp.cid');
      if (!cid) { cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('pp.cid', cid); }
    } catch (e) { cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    // NTP-style clock sync to the Mac (the master clock) so per-device latency is
    // comparable across phones. Keep the minimum-RTT sample.
    let clockOffset = 0, clockSynced = false;
    const serverNow = () => Date.now() + clockOffset;
    async function syncClock(){
      let best = Infinity, off = clockOffset;
      for (let i = 0; i < 8; i++){
        const t0 = Date.now();
        let t;
        try { t = (await (await fetch('/api/time', { cache: 'no-store' })).json()).t; }
        catch (e) { return; }
        const t1 = Date.now(), rtt = t1 - t0;
        if (rtt < best){ best = rtt; off = t - (t0 + rtt / 2); }
      }
      // Reject an all-congested sync: a best sample worse than 250ms RTT would
      // inject phantom inter-device spread. Keep the prior offset (or stay unsynced).
      if (best < 250){ clockOffset = off; clockSynced = true; }
    }

    // Latency behind live, in seconds, or null if unknown.
    function measureLatency(){
      try { if (hls && typeof hls.latency === 'number' && hls.latency > 0 && hls.latency < 60) return hls.latency; } catch (e) {}
      try {
        if (clockSynced && typeof player.getStartDate === 'function'){
          const sd = player.getStartDate();
          const base = sd && sd.getTime ? sd.getTime() : NaN;
          if (!isNaN(base)){
            const lat = (serverNow() - (base + player.currentTime * 1000)) / 1000;
            if (lat > 0 && lat < 60) return lat;
          }
        }
      } catch (e) {}
      return null;
    }

    function setStatus(t){ pilltext.textContent = t; }
    function setPlayingUI(on){
      document.body.classList.toggle('playing', on);
      ico.textContent = on ? '❚❚' : '►';
      btnlabel.textContent = on ? 'Playing' : (live ? 'Tap to listen' : 'Waiting for DJ');
    }

    // Fast, bounded retries: after a Wi-Fi blip we want audio back in ~1-2s,
    // not tens of seconds of exponential backoff (every second of stall is
    // added latency at playback rate 1x).
    const RETRY = { maxNumRetry: 1e9, retryDelayMs: 500, maxRetryDelayMs: 2000 };
    const LOAD_POLICY = { default: { maxTimeToFirstByteMs: 10000, maxLoadTimeMs: 20000, timeoutRetry: RETRY, errorRetry: RETRY } };

    function attach(){
      if (!STREAM) return;
      if (useNative) {
        player.src = STREAM;                       // Safari/iOS — native (LL-)HLS, the lock-safe path
      } else if (window.Hls && Hls.isSupported()) {
        if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
        const ll = delivery === 'llhls';
        const target = latencyTarget || (ll ? 3 : 7);
        const cfg = {
          lowLatencyMode: ll,
          // 5% catch-up after stalls (pitch-preserved by default in Chrome):
          // without it every rebuffer adds its full duration to this phone's
          // latency FOREVER, ratcheting it away from the room until an audible
          // backstop skip. 1.05 converges it back to the shared room target —
          // better sync, no audible artifact.
          maxLiveSyncPlaybackRate: 1.05,
          liveDurationInfinity: true,
          backBufferLength: 30,
          manifestLoadPolicy: LOAD_POLICY, playlistLoadPolicy: LOAD_POLICY, fragLoadPolicy: LOAD_POLICY,
          // Align to the ROOM's wall-clock target rather than this player's own
          // preference — the sync contract every phone converges to. In llhls
          // this deliberately overrides PART-HOLD-BACK: the room dropping
          // together beats being 2s closer to the DJ. (liveMaxLatencyDuration
          // is only legal alongside liveSyncDuration — never set it alone, the
          // constructor throws.)
          liveSyncDuration: target,
          liveMaxLatencyDuration: target + 4,
        };
        hls = new Hls(cfg);
        let mediaErrors = 0;
        hls.on(Hls.Events.ERROR, (_e, d) => {
          if (!d || !d.fatal) return;
          try {
            if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
              // startLoad() cannot rebuild a broken MediaSource — this can.
              mediaErrors++;
              if (mediaErrors > 1) hls.swapAudioCodec();
              hls.recoverMediaError();
            } else if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hls.startLoad();
            } else {
              attach(); // last resort: rebuild the whole player
            }
          } catch (e) {}
        });
        hls.on(Hls.Events.FRAG_BUFFERED, () => { mediaErrors = 0; });
        hls.loadSource(STREAM); hls.attachMedia(player);
      } else {
        player.src = STREAM;
      }
    }

    function attachSafe(){
      try { attach(); return true; }
      catch (e) { setStatus('player error — reload the page'); return false; }
    }

    async function play(){
      if (!STREAM) { try { await poll(); } catch (e) {} }
      if (!attachSafe()) return;
      try { await player.play(); }
      catch (e) { setStatus(live ? 'tap again to start' : 'waiting for the DJ…'); }
    }

    let userPaused = false; // deliberate pause: never auto-resumed
    btn.addEventListener('click', () => {
      if (document.body.classList.contains('playing')) { userPaused = true; try { player.pause(); } catch (e) {} }
      else { userPaused = false; mediaSession(); play().catch(()=>{}); }   // register the media session synchronously in the gesture
    });

    let errRetries = 0;
    player.addEventListener('playing', () => { started = true; errRetries = 0; setPlayingUI(true); setStatus('live'); });
    player.addEventListener('waiting', () => { stalledSinceBeat = true; setStatus('buffering…'); });
    // Safari fires 'stalled' spuriously on live streams (~3s without bytes is
    // normal between refreshes) — only treat it as real when starved.
    player.addEventListener('stalled', () => {
      if (player.readyState < 3) { stalledSinceBeat = true; setStatus('reconnecting…'); player.play().catch(()=>{}); }
    });
    player.addEventListener('pause',   () => { setPlayingUI(false); if (started) setStatus('paused'); });
    player.addEventListener('error',   () => {
      setStatus('reconnecting…');
      const delay = Math.min(500 * Math.pow(2, errRetries++), 5000);
      setTimeout(() => { attachSafe(); player.play().catch(()=>{}); }, delay);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { syncClock(); if (started && !userPaused) player.play().catch(()=>{}); }
    });
    document.getElementById('vol').addEventListener('input', e => { player.volume = Number(e.target.value); });
    // iOS ignores programmatic volume (hardware buttons only) — hide the dead slider.
    try {
      player.volume = 0.7;
      if (Math.abs(player.volume - 0.7) > 0.01) document.querySelector('.vol').style.display = 'none';
      else player.volume = 1;
    } catch (e) {}

    function mediaSession(){
      if (!('mediaSession' in navigator)) return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: titleEl.textContent || 'Live', artist: 'partyparty',
          artwork: [{ src: '/art-512.png', sizes: '512x512', type: 'image/png' }]
        });
        navigator.mediaSession.setActionHandler('play',  () => { userPaused = false; player.play().catch(()=>{}); });
        navigator.mediaSession.setActionHandler('pause', () => { userPaused = true; player.pause(); });
      } catch (e) {}
    }

    async function poll(){
      try {
        const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
        if (s.streamUrl) STREAM = s.streamUrl;
        if (s.delivery) delivery = s.delivery;
        if (typeof s.latencyTarget === 'number' && s.latencyTarget > 0) latencyTarget = s.latencyTarget;
        titleEl.textContent = s.name || 'partyparty';
        live = s.broadcast && s.broadcast.state === 'live';
        countEl.textContent = s.listeners ? ('● ' + s.listeners + ' listening') : '';
        if (!started) {
          setStatus(live ? 'ready — tap to listen' : 'waiting for the DJ…');
          btnlabel.textContent = live ? 'Tap to listen' : 'Waiting for DJ';
        }
      } catch (e) { if (!started) setStatus('offline'); }
    }
    poll(); setInterval(poll, 3000);
    syncClock(); setInterval(syncClock, 30000);

    // Heartbeat so the DJ console can count listeners, sense strain, and measure
    // inter-device latency spread (any delivery mode).
    let diagEl = null, stallCount = 0;
    player.addEventListener('waiting', () => { stallCount++; });
    function showDebug(lat){
      if (!diagEl){
        diagEl = document.createElement('div');
        diagEl.style.cssText = 'position:fixed;top:8px;left:8px;right:8px;background:#000a;color:#0f9;font:12px/1.5 ui-monospace,monospace;padding:8px 10px;border-radius:8px;text-align:left;z-index:9;white-space:pre';
        document.body.appendChild(diagEl);
      }
      diagEl.textContent =
        'platform : ' + platform + '\n' +
        'state    : ' + (player.paused ? 'paused' : 'playing') + '  rs=' + player.readyState + '\n' +
        'latency  : ' + (lat != null ? lat.toFixed(2) + ' s' : 'n/a') + '\n' +
        'target   : ' + (latencyTarget ? latencyTarget.toFixed(1) + ' s  err=' + (lat != null ? ((lat - latencyTarget) >= 0 ? '+' : '') + (lat - latencyTarget).toFixed(2) + 's' : '?') : 'n/a') + '  rate=' + player.playbackRate.toFixed(2) + '\n' +
        'clock    : ' + (clockSynced ? (clockOffset >= 0 ? '+' : '') + Math.round(clockOffset) + ' ms' : 'syncing…') + '\n' +
        'stalls   : ' + stallCount;
    }

    // Room sync for the NATIVE player (Safari/iOS): each iOS version parks at
    // its own distance behind live — seconds apart across phones, the single
    // biggest source of room spread. Converge on the shared server target using
    // the clock-synced latency we already measure: a seek when far off (join,
    // big disruption), gentle pitch-preserved rate nudges otherwise. Field-
    // verified that these timers keep firing on a locked iPhone.
    // (hls.js phones align via liveSyncDuration in the config above.)
    function alignNative(){
      if (!useNative || !started || player.paused || !latencyTarget) return;
      if (player.readyState < 3) return;           // don't fight a buffering player
      const lat = measureLatency();
      if (lat == null) return;
      const err = lat - latencyTarget;              // >0: too far behind → move toward live
      try {
        if (Math.abs(err) > 0.75) {
          const sk = player.seekable;
          if (sk && sk.length) {
            const lo = sk.start(sk.length - 1) + 0.5, hi = sk.end(sk.length - 1) - 1.0;
            const t = Math.min(Math.max(player.currentTime + err, lo), hi);
            if (hi > lo) player.currentTime = t;
          }
          player.playbackRate = 1;
        } else if (err > 0.15) player.playbackRate = 1.05;
        else if (err < -0.15) player.playbackRate = 0.95;
        else player.playbackRate = 1;
      } catch (e) {}
    }
    try { player.preservesPitch = true; player.webkitPreservesPitch = true; } catch (e) {}
    setInterval(() => { if (document.visibilityState === 'visible') alignNative(); }, 2000);

    setInterval(() => {
      if (!started) return;
      alignNative(); // also under lock — this 5s tick keeps firing there (field-verified)
      const stalled = stalledSinceBeat || (!player.paused && player.readyState < 3);
      const lat = measureLatency();
      let url = '/api/heartbeat?stalled=' + (stalled ? '1' : '0') + '&paused=' + (player.paused ? '1' : '0') + '&cid=' + encodeURIComponent(cid) + '&plat=' + platform;
      if (lat != null) url += '&lat=' + Math.round(lat * 1000);
      fetch(url, { cache: 'no-store' }).catch(() => {});
      stalledSinceBeat = false;
      if (debug) showDebug(lat);
    }, 5000);
  </script>
</body>
</html>
