# Drop-in applied to rrr-stream.service and rrr-youtube.service.
#
# partyparty is the priority workload on this box. The radio and the YouTube
# encode are continuous and CPU-hungry (ffmpeg sits near a full core and the
# headless browser takes more), so without this the relay would compete with them
# on equal footing during a party.
#
# This does NOT throttle chiptunes while the box is idle, which is almost always.
# CPUWeight only matters under contention: when nothing else wants the CPU, these
# services still get all of it. It only decides who yields when a party is live.
[Service]
CPUWeight=20
IOWeight=50
