name: Release

# Tag a version (e.g. `git tag v0.1.1 && git push --tags`) to build, Developer-ID
# sign, notarize, staple, sign the Sparkle appcast, and publish the download to
# party.ramine.net (Cloudflare R2 + Worker). Installed apps then auto-update.
# The `make release` script does the same thing locally. Required secrets are
# listed in docs/RELEASING.md.
on:
  # MANUAL ONLY. Releases ship locally via scripts/ship.sh (sign → notarize →
  # staple → appcast → deploy). The tag auto-trigger is disabled so pushes never
  # spin up a macOS runner or spam CI email.
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release (tag record + notes)

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle mediamtx (Homebrew) for the embed/helper step
        run: brew install mediamtx

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPASS="$(uuidgen)"
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign + assemble the .app
        env:
          PP_SIGN_ID: ${{ secrets.MACOS_DEVELOPER_ID }}   # "Developer ID Application: Name (TEAMID)"
        run: make app

      - name: Notarize + staple
        env:
          AC_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}   # the .p8, base64
        run: |
          set -euo pipefail
          echo "$AC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
          ditto -c -k --keepParent build/partyparty.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/ac_key.p8" --key-id "$AC_KEY_ID" --issuer "$AC_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple build/partyparty.app
          xcrun stapler validate build/partyparty.app
          rm -f "$RUNNER_TEMP/ac_key.p8"

      - name: Package versioned zip
        run: |
          set -euo pipefail
          # Version comes from Info.plist (bump it before tagging) — keeps CI and
          # `make release` identical and avoids mis-parsing a branch dispatch.
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Info.plist)"
          mkdir -p dist
          ditto -c -k --keepParent build/partyparty.app "dist/partyparty-${VERSION}.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # NB: the 'latest' partyparty.zip alias is created AFTER appcast signing —
          # generate_appcast aborts if dist/ holds two archives of the same version.

      - name: Sign the Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPK_VER=2.9.3
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPK_VER}/Sparkle-${SPK_VER}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          # generate_appcast reads the private key from stdin (-f -), checks it
          # matches the app's SUPublicEDKey, and writes a signed dist/appcast.xml
          # whose enclosures point at party.ramine.net.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://party.ramine.net/" dist
          ls -la dist

      - name: Publish to Cloudflare (R2 + Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "4e958c1f2621ced0354e94826590e34f"   # not secret
        run: |
          set -euo pipefail
          cp "dist/partyparty-${VERSION}.zip" dist/partyparty.zip   # 'latest' alias — safe now (appcast already signed)
          npm --prefix cloudflare install --no-audit --no-fund
          WR="$PWD/cloudflare/node_modules/.bin/wrangler"
          "$WR" r2 object put "partyparty-dl/partyparty-${VERSION}.zip" --file "dist/partyparty-${VERSION}.zip" --content-type application/zip --remote
          "$WR" r2 object put "partyparty-dl/partyparty.zip"            --file "dist/partyparty.zip"            --content-type application/zip --remote
          "$WR" r2 object put "partyparty-dl/appcast.xml"               --file "dist/appcast.xml"               --content-type application/xml --remote
          ( cd cloudflare && "$WR" deploy )

      - name: GitHub Release (tag record + notes)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
