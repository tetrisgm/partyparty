name: CI

# Fast build-check on every push/PR. The full signed+notarized release pipeline
# (Developer ID sign → notarize → staple → Sparkle appcast → GitHub Release) is a
# separate workflow added once the .app bundle + menu-bar shell land.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The real ffmpeg/mediamtx/ppcapture are gitignored and built by `make`
      # for releases. For a compile-check we only need the go:embed targets to
      # exist, so stub them — the binary won't run, but the code compiles.
      - name: Stub embedded assets
        run: |
          mkdir -p assets
          : > assets/ffmpeg
          : > assets/mediamtx
          : > assets/ppcapture

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "::error::unformatted Go files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...
