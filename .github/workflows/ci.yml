name: CI

# MANUAL ONLY. Disabled the push/PR auto-triggers deliberately: releases are
# built + verified locally before every push, so per-push macOS-runner CI burned Actions minutes
# and spammed failure emails. Run on demand from the Actions tab if ever needed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The real ffmpeg/mediamtx/ppcapture are gitignored and built by `make`
      # for releases. For a compile-check we only need the go:embed targets to
      # exist, so stub them - the binary won't run, but the code compiles.
      - name: Stub embedded assets
        run: |
          mkdir -p assets
          : > assets/ffmpeg
          : > assets/mediamtx
          : > assets/ppcapture

      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "::error::unformatted Go files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race: the broadcast/mediamtx suites deliberately hammer the
      # start/stop/supersede paths concurrently. Tests use /bin/sh stubs in
      # place of ffmpeg/mediamtx, so the empty asset stubs above are fine.
      - name: go test
        run: go test -race ./...
