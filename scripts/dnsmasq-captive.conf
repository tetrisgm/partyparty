# Optional: dnsmasq config to make the captive-portal auto-open work and to give
# guests a memorable name (http://party). Only needed if the Mac itself is the
# router/DNS for the hotspot. A GL.iNet/OpenWrt travel router can do all of this
# more reliably — see README.
#
# Install:  brew install dnsmasq
# Edit the IP below to your hotspot address (macOS Internet Sharing = 192.168.2.1).
# Run:      sudo dnsmasq -C scripts/dnsmasq-captive.conf -d   (foreground, to test)
# Then start partyparty with --captive so it answers the OS connectivity probes.

# Listen only on the hotspot interface address.
listen-address=192.168.2.1
bind-interfaces
no-resolv

# Hijack ALL DNS to the Mac so every probe + name lands on partyparty.
address=/#/192.168.2.1

# A friendly name guests can type: http://party:8000/
address=/party/192.168.2.1
address=/party.lan/192.168.2.1
